volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: vitaminsp/taski_backend:latest
    restart: always
    env_file: .env
    volumes:
      - static_volume:/backend_static
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: vitaminsp/taski_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: vitaminsp/taski_gateway:latest
    restart: always
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend