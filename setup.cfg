[flake8]
ignore =
    W503,
    F811,
    D100,
    D101,
    D102,
    D103,
    D104,
    D106,
    I004,
    E501,
    E203,
    W291,
    W292,
    W293
exclude =
    .git,
    __pycache__,
    */migrations/,
    venv,
    */venv/,
    env,
    */env/,
    .venv,
    .env,
    .pytest_cache,
    .tox,
    .eggs,
    build,
    dist,
    *.egg-info
max-line-length = 120
jobs = 4
per-file-ignores =
    */settings.py:E501
    */__init__.py:F401,F403
    */conftest.py:F401,F403
    */manage.py:D100,E501
